services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
    volumes:
      - ./n8n_workflows:/workflows
      - .:/data

  langgraph_service:
    build:
      context: .
      dockerfile: langgraph_service/Dockerfile
    env_file: .env
    volumes:
      - ./n8n_workflows/output:/app/n8n_workflows/output
      - ./langgraph_service/output:/app/langgraph_service/output
    depends_on:
      - n8n
